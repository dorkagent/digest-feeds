name: collect-ai-trading
# r/ai_trading 7-day pull for the weekly strategy digest.
# Runs Thu 16:30 UTC = 09:30 PT (PDT); the VM digest job fires Thu 10:44 PT.
# Keyless (Arctic Shift). No secrets.
on:
  schedule:
    - cron: "30 16 * * 4"
  workflow_dispatch:
permissions:
  contents: write
# Per-workflow group: a manual dispatch queues behind the scheduled run of
# the SAME collector (same output file) instead of racing it. Cross-collector
# push races are handled by the commit step's rebase-and-retry loop; a shared
# group would let a third queued run cancel a pending one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect r/ai_trading (7d)
        run: |
          WK=$(TZ=America/Los_Angeles date +%G-W%V)
          mkdir -p data/ai-trading
          python3 scripts/collect_reddit.py --subreddit ai_trading --days 7 \
            --out data/ai-trading/posts-$WK.json
      - name: Commit data
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"; exit 0
          fi
          git commit -m "collect ai-trading $(date -u +%F)"
          # Rebase only AFTER committing (pull --rebase refuses a staged
          # index). Retry covers a push race with another collector; on a
          # rebase conflict, abort so the next attempt starts clean.
          for i in 1 2 3 4; do
            if git pull --rebase; then
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 10))
          done
          echo "push failed after retries" >&2
          exit 1
