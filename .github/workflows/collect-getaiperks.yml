name: collect-getaiperks
# Get AI Perks blog index + free-stuff sweep inputs for the weekly digest.
# Runs Wed 15:30 UTC = 08:30 PT (PDT); the VM digest job fires Wed 09:44 PT.
# Keyless (blog HTML, Arctic Shift, HN Algolia API). No secrets.
on:
  schedule:
    - cron: "30 15 * * 3"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect blog index + freebies
        run: |
          WK=$(date -u +%G-W%V)
          mkdir -p data/getaiperks
          python3 scripts/collect_getaiperks.py data/getaiperks/blog-$WK.json
          python3 scripts/collect_freebies.py data/getaiperks/freebies-$WK.json
      - name: Commit data
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add data/
          git diff --cached --quiet || git commit -m "collect getaiperks $(date -u +%F)"
          git push
