name: collect-getaiperks
# Get AI Perks blog index + free-stuff sweep inputs for the weekly digest.
# Runs Wed 15:30 UTC = 08:30 PT (PDT); the VM digest job fires Wed 09:44 PT.
# Keyless (blog HTML, Arctic Shift, HN Algolia API). No secrets.
on:
  schedule:
    - cron: "30 15 * * 3"
  workflow_dispatch:
permissions:
  contents: write
# Per-workflow group: a manual dispatch queues behind the scheduled run of
# the SAME collector (same output file) instead of racing it. Cross-collector
# push races are handled by the commit step's rebase-and-retry loop; a shared
# group would let a third queued run cancel a pending one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Separate steps with continue-on-error: a blog-index failure must not
      # take down the freebies file (and vice versa). Each script also
      # isolates its own sources and writes partial output on failure.
      - name: Collect blog index
        id: blog
        continue-on-error: true
        run: |
          WK=$(TZ=America/Los_Angeles date +%G-W%V)
          mkdir -p data/getaiperks
          python3 scripts/collect_getaiperks.py data/getaiperks/blog-$WK.json
      - name: Collect freebies sweep
        id: freebies
        continue-on-error: true
        run: |
          WK=$(TZ=America/Los_Angeles date +%G-W%V)
          mkdir -p data/getaiperks
          python3 scripts/collect_freebies.py data/getaiperks/freebies-$WK.json
      - name: Commit data
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"; exit 0
          fi
          git commit -m "collect getaiperks $(date -u +%F)"
          # Rebase only AFTER committing (pull --rebase refuses a staged
          # index). Retry covers a push race with another collector; on a
          # rebase conflict, abort so the next attempt starts clean.
          for i in 1 2 3 4; do
            if git pull --rebase; then
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 10))
          done
          echo "push failed after retries" >&2
          exit 1
      # continue-on-error keeps one source's failure from blocking the other's
      # commit, but would leave the run green. Surface it after committing.
      - name: Fail run if a collector failed
        if: steps.blog.outcome == 'failure' || steps.freebies.outcome == 'failure'
        run: |
          echo "blog=${{ steps.blog.outcome }} freebies=${{ steps.freebies.outcome }}" >&2
          exit 1
