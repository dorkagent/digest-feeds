name: collect-ai-agents
# r/AI_Agents 7-day pull for the weekly digest.
# Runs Wed 16:30 UTC = 09:30 PT (PDT); the VM digest job consumes it Wed.
# Keyless (Arctic Shift). No secrets.
on:
  schedule:
    - cron: "30 16 * * 3"
  workflow_dispatch:
permissions:
  contents: write
# One data-push at a time across all collectors (push-race guard); the
# pull --rebase below makes each push fast-forward after waiting.
concurrency:
  group: digest-feeds-data-push
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect r/AI_Agents (7d)
        run: |
          WK=$(TZ=America/Los_Angeles date +%G-W%V)
          mkdir -p data/ai-agents
          python3 scripts/collect_reddit.py --subreddit AI_Agents --days 7 --top-n 25 \
            --out data/ai-agents/posts-$WK.json
      - name: Commit data
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add data/
          git pull --rebase
          git diff --cached --quiet || git commit -m "collect ai-agents $(date -u +%F)"
          git push
