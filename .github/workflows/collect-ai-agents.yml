name: collect-ai-agents
# r/AI_Agents 7-day pull for the weekly digest.
# Runs Wed 15:00 UTC = 08:00 PDT / 07:00 PST, well ahead of the VM
# wednesday-intel-digest (09:44 PT) even with GitHub cron delays, and
# offset from the 15:30 getaiperks freebies pull (also Arctic Shift).
# Keyless (Arctic Shift). No secrets.
on:
  schedule:
    - cron: "0 15 * * 3"
  workflow_dispatch:
permissions:
  contents: write
# Per-workflow group: a manual dispatch queues behind the scheduled run of
# the SAME collector (same output file) instead of racing it. Cross-collector
# push races are handled by the commit step's rebase-and-retry loop; a shared
# group would let a third queued run cancel a pending one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect r/AI_Agents (7d)
        run: |
          WK=$(TZ=America/Los_Angeles date +%G-W%V)
          mkdir -p data/ai-agents
          python3 scripts/collect_reddit.py --subreddit AI_Agents --days 7 --top-n 25 \
            --out data/ai-agents/posts-$WK.json
      - name: Commit data
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"; exit 0
          fi
          git commit -m "collect ai-agents $(date -u +%F)"
          # Rebase only AFTER committing (pull --rebase refuses a staged
          # index). Retry covers a push race with another collector; on a
          # rebase conflict, abort so the next attempt starts clean.
          for i in 1 2 3 4; do
            if git pull --rebase; then
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 10))
          done
          echo "push failed after retries" >&2
          exit 1
