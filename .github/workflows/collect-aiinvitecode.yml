name: collect-aiinvitecode
# AIInviteCode /new listings (AI invite codes added in the last 7 days).
# Feeds the free-AI-toolkit hunt. Manual trigger only until Andrew approves
# a cadence. Keyless (plain HTTPS, server-rendered HTML). No secrets.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect invite-code listings
        run: |
          mkdir -p data/aiinvitecode
          python3 scripts/collect_aiinvitecode.py data/aiinvitecode/new-$(date -u +%F).json
      - name: Commit data
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add data/
          git diff --cached --quiet || git commit -m "collect aiinvitecode $(date -u +%F)"
          git push
