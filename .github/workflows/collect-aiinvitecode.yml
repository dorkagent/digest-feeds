name: collect-aiinvitecode
# AIInviteCode /new listings (AI invite codes added in the last 7 days).
# Feeds the free-AI-toolkit hunt. Runs daily 15:30 UTC = 08:30 PT so the
# data is fresh for the VM daily new-arrival check at 09:00 PT.
# Keyless (plain HTTPS, server-rendered HTML). No secrets.
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
# One data-push at a time across all collectors (push-race guard); the
# pull --rebase below makes each push fast-forward after waiting.
concurrency:
  group: digest-feeds-data-push
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Collect invite-code listings
        run: |
          mkdir -p data/aiinvitecode
          python3 scripts/collect_aiinvitecode.py data/aiinvitecode/new-$(date -u +%F).json
      - name: Commit data
        run: |
          git config user.name "dorkagent"
          git config user.email "dork@agentmail.to"
          git add data/
          git pull --rebase
          git diff --cached --quiet || git commit -m "collect aiinvitecode $(date -u +%F)"
          git push
